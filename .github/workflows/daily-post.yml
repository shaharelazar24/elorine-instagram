name: ELORINE — daily social posts

on:
  schedule:
    # GitHub עובד ב-UTC ולא מכיר שעון קיץ, לכן יורים פעמיים
    # והשלב הראשון מוודא שזו באמת ההרצה של 10:00 בישראל. הרצה אחת ביום.
    # 0-5 = ראשון עד שישי. שבת לא נכללת — אין פרסום בשבת.
    - cron: "0 7 * * 0-5"   # 10:00 בשעון קיץ (IDT, UTC+3)
    - cron: "0 8 * * 0-5"   # 10:00 בשעון חורף (IST, UTC+2)
  workflow_dispatch:
    inputs:
      carousels:
        description: "כמה קרוסלות"
        required: false
        default: "1"
      atmosphere:
        description: "כמה פוסטי אווירה"
        required: false
        default: "1"
      singles:
        description: "כמה שמלות בודדות"
        required: false
        default: "3"
      generate:
        description: "לייצר תמונות חדשות? false = לפרסם רק מה שכבר קיים (true/false)"
        required: false
        default: "true"
      publish:
        description: "לפרסם? (true/false)"
        required: false
        default: "true"
      facebook:
        description: "לפרסם גם לפייסבוק? (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: elorine-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-image' }}
      GEMINI_IMAGE_SIZE: ${{ vars.GEMINI_IMAGE_SIZE || '2K' }}
      MIN_IMAGE_HEIGHT: ${{ vars.MIN_IMAGE_HEIGHT || '1400' }}

      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}

      CAROUSELS_PER_RUN: ${{ github.event.inputs.carousels || vars.CAROUSELS_PER_RUN || '1' }}
      ATMOSPHERE_PER_RUN: ${{ github.event.inputs.atmosphere || vars.ATMOSPHERE_PER_RUN || '1' }}
      SINGLES_PER_RUN: ${{ github.event.inputs.singles || vars.SINGLES_PER_RUN || '3' }}
      PUBLISH_TO_FACEBOOK: ${{ github.event.inputs.facebook || 'true' }}

    steps:
      # ---------- 0. שער שעון ישראל ----------
      # שתי הרצות מתוזמנות ביום. השער בודק *איזה cron ירה* ולא מה השעה עכשיו,
      # כי GitHub נוהג לעכב הרצות מתוזמנות בעשרות דקות. לפי ה-cron ולפי
      # היסט השעון בישראל (+03:00 בקיץ, +02:00 בחורף) רק אחת מהשתיים ממשיכה.
      - name: Gate to 10:00 Israel time
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "הרצה ידנית — ממשיכים."; exit 0
          fi
          CRON="${{ github.event.schedule }}"
          OFFSET=$(TZ=Asia/Jerusalem date +%z)
          NOW=$(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M')
          DOW=$(TZ=Asia/Jerusalem date +%u)          # 1=שני … 6=שבת, 7=ראשון
          echo "cron: '${CRON}' · היסט ישראל: ${OFFSET} · עכשיו בישראל: ${NOW}"

          if [ "$DOW" = "6" ]; then
            echo "שבת בישראל — אין פרסום. מדלגים."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi

          WANT=""
          if [ "$OFFSET" = "+0300" ]; then WANT="0 7 * * 0-5"; fi   # שעון קיץ
          if [ "$OFFSET" = "+0200" ]; then WANT="0 8 * * 0-5"; fi   # שעון חורף

          if [ -n "$WANT" ] && [ "$CRON" = "$WANT" ]; then
            echo "זו ההרצה של 10:00 בישראל — מריצים."
          else
            echo "ה-cron הזה לא מתאים ל-10:00 בישראל כרגע — מדלגים."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: env.SKIP != '1'

      # ---------- 1. ייצור ----------
      - name: Generate posts
        if: env.SKIP != '1' && (github.event.inputs.generate || 'true') == 'true'
        run: python pipeline.py generate

      # ---------- 2. דחיפה ל-repo (כדי לקבל URL ציבורי) ----------
      - name: Commit generated posts
        if: env.SKIP != '1' && (github.event.inputs.generate || 'true') == 'true'
        run: |
          git config user.name  "elorine-bot"
          git config user.email "actions@github.com"
          git add posts/ state/
          if git diff --staged --quiet; then
            echo "NOTHING_GENERATED=1" >> "$GITHUB_ENV"
            echo "לא נוצרו פוסטים חדשים."
          else
            git commit -m "posts: $(date -u +%Y-%m-%d)"
            git push
          fi

      # ---------- 3. פרסום ----------
      - name: Publish to Instagram and Facebook
        if: env.SKIP != '1' && env.NOTHING_GENERATED != '1' && (github.event.inputs.publish || 'true') == 'true'
        run: python pipeline.py publish

      # ---------- 4. שמירת ה-state ----------
      - name: Commit state
        if: always() && env.SKIP != '1' && env.NOTHING_GENERATED != '1'
        run: |
          git config user.name  "elorine-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add state/ posts/
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%d)"
          git push || true

      - name: Upload run artifacts
        if: always() && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: elorine-run-${{ github.run_number }}
          path: posts/
          retention-days: 14
          if-no-files-found: ignore
