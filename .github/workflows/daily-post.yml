name: ELORINE — daily social posts

on:
  schedule:
    # GitHub Actions לא מבטיח שהרצה מתוזמנת תצא בזמן. בתיעוד שלהם כתוב
    # במפורש שהעומס הכי גדול הוא *בתחילת כל שעה*, ושכדאי לתזמן לדקה אחרת.
    # לכן אף ירייה כאן לא בדקה :00 — כולן בדקות "מוזרות" ומפוזרות.
    #
    # שש יריות ביום, ראשון עד שישי (0-5). שבת לא נכללת.
    # בקיץ הראשונה היא 10:11 בישראל, בחורף 10:14. השאר רשת ביטחון.
    # השער למטה מוודא 10:00-15:59 בישראל, והבדיקה שאחריו מוודאת
    # שאם כבר פורסם היום — לא מפרסמים שוב.
    - cron: "11 7 * * 0-5"
    - cron: "14 8 * * 0-5"
    - cron: "19 9 * * 0-5"
    - cron: "26 10 * * 0-5"
    - cron: "33 11 * * 0-5"
    - cron: "41 12 * * 0-5"
  workflow_dispatch:
    inputs:
      carousels:
        description: "כמה קרוסלות"
        required: false
        default: "2"
      atmosphere:
        description: "כמה פוסטי אווירה (0 = כבוי)"
        required: false
        default: "0"
      singles:
        description: "כמה שמלות בודדות"
        required: false
        default: "3"
      generate:
        description: "לייצר תמונות חדשות? false = לפרסם רק מה שכבר קיים (true/false)"
        required: false
        default: "true"
      publish:
        description: "לפרסם? (true/false)"
        required: false
        default: "true"
      facebook:
        description: "לפרסם גם לפייסבוק? (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: elorine-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # הנסיונות החוזרים מול Gemini יכולים להאריך הרצה בימי עומס
    timeout-minutes: 110

    env:
      SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-image' }}
      GEMINI_IMAGE_SIZE: ${{ vars.GEMINI_IMAGE_SIZE || '2K' }}
      MIN_IMAGE_HEIGHT: ${{ vars.MIN_IMAGE_HEIGHT || '1400' }}

      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}

      CAROUSELS_PER_RUN: ${{ github.event.inputs.carousels || vars.CAROUSELS_PER_RUN || '2' }}
      ATMOSPHERE_PER_RUN: ${{ github.event.inputs.atmosphere || vars.ATMOSPHERE_PER_RUN || '0' }}
      SINGLES_PER_RUN: ${{ github.event.inputs.singles || vars.SINGLES_PER_RUN || '3' }}
      PUBLISH_TO_FACEBOOK: ${{ github.event.inputs.facebook || 'true' }}

    steps:
      # ---------- 0. שער שעון ישראל ----------
      # מותר לרוץ בין 10:00 ל-15:59 בשעון ישראל, ראשון עד שישי.
      # החלון הרחב הוא בכוונה: היריות המאוחרות הן רשת ביטחון למקרה
      # שההרצה של 10:00 נדחתה או נפלה. הבדיקה הבאה מונעת פרסום כפול.
      - name: Gate to Israel morning window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "הרצה ידנית — ממשיכים."; exit 0
          fi
          NOW=$(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M %Z')
          DOW=$(TZ=Asia/Jerusalem date +%u)              # 1=שני … 6=שבת, 7=ראשון
          H=$((10#$(TZ=Asia/Jerusalem date +%H)))
          echo "cron: '${{ github.event.schedule }}' · עכשיו בישראל: ${NOW}"

          if [ "$DOW" = "6" ]; then
            echo "שבת בישראל — אין פרסום. מדלגים."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$H" -ge 10 ] && [ "$H" -le 15 ]; then
            echo "בתוך החלון (10:00-15:59) — ממשיכים."
          else
            echo "מחוץ לחלון (השעה ${H} בישראל) — מדלגים."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      # ---------- 0ב. מה כבר נעשה היום ----------
      #  חסרים פוסטים (Gemini נפל על חלקם) → סבב שמשלים רק את החסר.
      #  כל הפוסטים קיימים אך לא כולם פורסמו → פרסום בלבד, בלי ייצור.
      #  הכול קיים והכול פורסם               → מדלגים. אין פרסום כפול.
      - name: Decide what is left to do today
        if: env.SKIP != '1' && github.event_name == 'schedule'
        run: |
          D=$(date -u +%F)
          M="posts/${D}/manifest.json"
          WANT=$(( ${CAROUSELS_PER_RUN:-2} + ${ATMOSPHERE_PER_RUN:-0} + ${SINGLES_PER_RUN:-3} ))

          if [ ! -f "$M" ]; then
            echo "אין manifest להיום (${D}) — סבב מלא (${WANT} פוסטים)."
            exit 0
          fi

          HAVE=$(python3 -c "import json;print(len(json.load(open('$M'))))")
          UNPUB=$(python3 -c "import json;print(sum(1 for e in json.load(open('$M')) if not e.get('published_ig')))")
          echo "היום (${D}): ${HAVE}/${WANT} פוסטים קיימים, ${UNPUB} עוד לא פורסמו."

          if [ "$HAVE" -lt "$WANT" ]; then
            echo "חסרים פוסטים — משלימים את החסר."
          elif [ "$UNPUB" -gt 0 ]; then
            echo "הכול קיים אבל לא הכול פורסם — פרסום בלבד."
            echo "GEN=false" >> "$GITHUB_ENV"
          else
            echo "היום מלא ומפורסם — מדלגים."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: env.SKIP != '1'

      # ---------- 1. ייצור ----------
      - name: Generate posts
        if: env.SKIP != '1' && env.GEN != 'false' && (github.event.inputs.generate || 'true') == 'true'
        run: python pipeline.py generate

      # ---------- 2. דחיפה ל-repo (כדי לקבל URL ציבורי) ----------
      - name: Commit generated posts
        if: env.SKIP != '1' && env.GEN != 'false' && (github.event.inputs.generate || 'true') == 'true'
        run: |
          git config user.name  "elorine-bot"
          git config user.email "actions@github.com"
          git add posts/ state/
          if git diff --staged --quiet; then
            echo "NOTHING_GENERATED=1" >> "$GITHUB_ENV"
            echo "לא נוצרו פוסטים חדשים."
            exit 0
          fi
          git commit -m "posts: $(date -u +%Y-%m-%d)"

          # ההרצה נמשכת דקות, ובינתיים ייתכן שנדחף commit אחר ל-main.
          # בלי rebase ה-push נדחה, התמונות לא מקבלות URL ציבורי,
          # והפרסום של כל היום נופל. לכן: rebase, ואם צריך — עוד נסיונות.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "נדחף בהצלחה (ניסיון ${i})."
              exit 0
            fi
            echo "push נדחה — מושכים ומנסים שוב (${i}/5)…"
            # בלי --autostash: הכול כבר ב-commit. בהתנגשות מעדיפים את מה
            # שההרצה הזו יצרה, ולעולם לא כותבים סימני התנגשות לתוך קובץ.
            if ! git pull --rebase origin main; then
              echo "התנגשות ב-rebase — מעדיפים את הפלט של ההרצה הזו."
              git checkout --theirs posts/ state/ 2>/dev/null || true
              git add posts/ state/ 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep $((5 * i))
          done
          echo "::error::ה-push נכשל אחרי 5 נסיונות — התמונות לא קיבלו URL ציבורי."
          exit 1

      # ---------- 3. פרסום ----------
      - name: Publish to Instagram and Facebook
        if: env.SKIP != '1' && env.NOTHING_GENERATED != '1' && (github.event.inputs.publish || 'true') == 'true'
        run: python pipeline.py publish

      # ---------- 4. שמירת ה-state ----------
      - name: Commit state
        if: always() && env.SKIP != '1' && env.NOTHING_GENERATED != '1'
        run: |
          git config user.name  "elorine-bot"
          git config user.email "actions@github.com"
          git add state/ posts/
          if git diff --staged --quiet; then
            echo "אין שינוי ב-state."; exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%d)"

          # קודם commit, ורק אז rebase — כך אין stash שיכול להתפוצץ
          # ולהשאיר סימני התנגשות בתוך manifest.json.
          for i in 1 2 3 4 5; do
            if git push; then echo "state נדחף (ניסיון ${i})."; exit 0; fi
            echo "push נדחה — מושכים ומנסים שוב (${i}/5)…"
            if ! git pull --rebase origin main; then
              echo "התנגשות ב-rebase — מעדיפים את הפלט של ההרצה הזו."
              git checkout --theirs posts/ state/ 2>/dev/null || true
              git add posts/ state/ 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep $((5 * i))
          done
          echo "::error::שמירת ה-state נכשלה."
          exit 1

      - name: Upload run artifacts
        if: always() && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: elorine-run-${{ github.run_number }}
          path: posts/
          retention-days: 14
          if-no-files-found: ignore
