name: ELORINE — daily social posts

on:
  schedule:
    # GitHub Actions לא מבטיח שהרצה מתוזמנת באמת תצא בזמן — היא נדחית
    # לפעמים בשעות, ולפעמים נופלת לגמרי. לכן יש כאן ארבע יריות:
    # הראשונה היא 10:00 בישראל (07:00Z בקיץ, 08:00Z בחורף) והשאר הן
    # רשת ביטחון לשעות שאחריה. השער למטה מוודא שזה בין 10:00 ל-15:59
    # בישראל ולא שבת, והבדיקה שאחריו מוודאת שלא מפרסמים פעמיים באותו יום.
    # 0-5 = ראשון עד שישי. שבת לא נכללת — אין פרסום בשבת.
    - cron: "0 7 * * 0-5"
    - cron: "0 8 * * 0-5"
    - cron: "0 9 * * 0-5"
    - cron: "0 10 * * 0-5"
  workflow_dispatch:
    inputs:
      carousels:
        description: "כמה קרוסלות"
        required: false
        default: "1"
      atmosphere:
        description: "כמה פוסטי אווירה"
        required: false
        default: "1"
      singles:
        description: "כמה שמלות בודדות"
        required: false
        default: "3"
      generate:
        description: "לייצר תמונות חדשות? false = לפרסם רק מה שכבר קיים (true/false)"
        required: false
        default: "true"
      publish:
        description: "לפרסם? (true/false)"
        required: false
        default: "true"
      facebook:
        description: "לפרסם גם לפייסבוק? (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: elorine-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-image' }}
      GEMINI_IMAGE_SIZE: ${{ vars.GEMINI_IMAGE_SIZE || '2K' }}
      MIN_IMAGE_HEIGHT: ${{ vars.MIN_IMAGE_HEIGHT || '1400' }}

      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}

      CAROUSELS_PER_RUN: ${{ github.event.inputs.carousels || vars.CAROUSELS_PER_RUN || '1' }}
      ATMOSPHERE_PER_RUN: ${{ github.event.inputs.atmosphere || vars.ATMOSPHERE_PER_RUN || '1' }}
      SINGLES_PER_RUN: ${{ github.event.inputs.singles || vars.SINGLES_PER_RUN || '3' }}
      PUBLISH_TO_FACEBOOK: ${{ github.event.inputs.facebook || 'true' }}

    steps:
      # ---------- 0. שער שעון ישראל ----------
      # מותר לרוץ בין 10:00 ל-15:59 בשעון ישראל, ראשון עד שישי.
      # החלון הרחב הוא בכוונה: היריות המאוחרות הן רשת ביטחון למקרה
      # שההרצה של 10:00 נדחתה או נפלה. הבדיקה הבאה מונעת פרסום כפול.
      - name: Gate to Israel morning window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "הרצה ידנית — ממשיכים."; exit 0
          fi
          NOW=$(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M %Z')
          DOW=$(TZ=Asia/Jerusalem date +%u)              # 1=שני … 6=שבת, 7=ראשון
          H=$((10#$(TZ=Asia/Jerusalem date +%H)))
          echo "cron: '${{ github.event.schedule }}' · עכשיו בישראל: ${NOW}"

          if [ "$DOW" = "6" ]; then
            echo "שבת בישראל — אין פרסום. מדלגים."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$H" -ge 10 ] && [ "$H" -le 15 ]; then
            echo "בתוך החלון (10:00-15:59) — ממשיכים."
          else
            echo "מחוץ לחלון (השעה ${H} בישראל) — מדלגים."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      # ---------- 0ב. מה כבר נעשה היום ----------
      #  אין manifest להיום            → סבב מלא: מייצרים ומפרסמים.
      #  יש manifest ונשארו לא-מפורסמים → פרסום בלבד, בלי לייצר מחדש
      #                                   (ככה הרצת המשך מסיימת מה שנתקע).
      #  יש manifest והכול פורסם        → מדלגים לגמרי. אין פרסום כפול.
      - name: Decide what is left to do today
        if: env.SKIP != '1' && github.event_name == 'schedule'
        run: |
          D=$(date -u +%F)
          M="posts/${D}/manifest.json"
          if [ ! -f "$M" ]; then
            echo "אין manifest להיום (${D}) — סבב מלא."
          elif grep -q '"published_ig": *false' "$M"; then
            echo "יש פוסטים שלא פורסמו היום (${D}) — פרסום בלבד, בלי ייצור."
            echo "GEN=false" >> "$GITHUB_ENV"
          else
            echo "הכול כבר פורסם היום (${D}) — מדלגים."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: env.SKIP != '1'

      # ---------- 1. ייצור ----------
      - name: Generate posts
        if: env.SKIP != '1' && env.GEN != 'false' && (github.event.inputs.generate || 'true') == 'true'
        run: python pipeline.py generate

      # ---------- 2. דחיפה ל-repo (כדי לקבל URL ציבורי) ----------
      - name: Commit generated posts
        if: env.SKIP != '1' && env.GEN != 'false' && (github.event.inputs.generate || 'true') == 'true'
        run: |
          git config user.name  "elorine-bot"
          git config user.email "actions@github.com"
          git add posts/ state/
          if git diff --staged --quiet; then
            echo "NOTHING_GENERATED=1" >> "$GITHUB_ENV"
            echo "לא נוצרו פוסטים חדשים."
          else
            git commit -m "posts: $(date -u +%Y-%m-%d)"
            git push
          fi

      # ---------- 3. פרסום ----------
      - name: Publish to Instagram and Facebook
        if: env.SKIP != '1' && env.NOTHING_GENERATED != '1' && (github.event.inputs.publish || 'true') == 'true'
        run: python pipeline.py publish

      # ---------- 4. שמירת ה-state ----------
      - name: Commit state
        if: always() && env.SKIP != '1' && env.NOTHING_GENERATED != '1'
        run: |
          git config user.name  "elorine-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add state/ posts/
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%d)"
          git push || true

      - name: Upload run artifacts
        if: always() && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: elorine-run-${{ github.run_number }}
          path: posts/
          retention-days: 14
          if-no-files-found: ignore
