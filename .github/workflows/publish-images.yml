name: ELORINE — publish images

# הרצה ידנית: מפרסם תמונות מוכנות מהריפו לאינסטגרם ולפייסבוק,
# פוסט בודד לכל תמונה, לפי הסדר.

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "נתיבי התמונות בריפו, מופרדים בפסיק"
        required: true
      handles:
        description: "handle של השמלה לכל תמונה, באותו סדר"
        required: false
        default: ""
      captions:
        description: "כיתוב ידני לכל תמונה, מופרד ב-|| (ריק = אוטומטי)"
        required: false
        default: ""
      facebook:
        description: "לפרסם גם לפייסבוק"
        required: false
        default: "true"
      gap:
        description: "שניות המתנה בין פוסט לפוסט"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: elorine-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
      PUBLISH_TO_FACEBOOK: ${{ github.event.inputs.facebook }}
      GAP_SECONDS: ${{ github.event.inputs.gap }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish
        env:
          PATHS: ${{ github.event.inputs.paths }}
          HANDLES: ${{ github.event.inputs.handles }}
          CAPTIONS: ${{ github.event.inputs.captions }}
        run: python publish_images.py "$PATHS" "$HANDLES" "$CAPTIONS"

      - name: Save state
        if: always()
        run: |
          git config user.name  "elorine-bot"
          git config user.email "actions@github.com"
          git add state/ || true
          if git diff --staged --quiet; then echo "אין שינוי בסטייט."; exit 0; fi
          git commit -m "state: published pool set"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((5 * i))
          done
          exit 1
